name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build QuestPDF.FSharp.slnx -c Release
      - name: Test QuestPDF.FSharp
        run: dotnet test tests/QuestPDF.FSharp.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Test QuestPDF.FSharp.Preview
        if: always()
        run: dotnet test tests/QuestPDF.FSharp.Preview.Tests -c Release --no-build --logger "console;verbosity=normal"
